name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # @discordjs/opus 等原生模組需要編譯；lint 與單元測試都不需要語音功能
      - run: npm ci --ignore-scripts

      - run: npm run lint

      # MUSIC_RESUME=0：測試不寫播放快照（data/musicSession.json）
      - run: npm test
        env:
          MUSIC_RESUME: '0'

      # high 以上的漏洞讓 CI 失敗（只在安裝時用到的 tar 例外，見腳本說明）
      - name: npm audit
        run: |
          npm audit --omit=dev --json > audit.json || true
          node .github/scripts/audit.js audit.json
