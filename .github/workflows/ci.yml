name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # @discordjs/opus 等原生模組需要編譯；CI 只跑 lint，不需要語音功能
      # （單元測試 test/ 不進版本庫，只在本機用 npm test 執行）
      - run: npm ci --ignore-scripts

      - run: npm run lint

      # high 以上的漏洞讓 CI 失敗（只在安裝時用到的 tar 例外，見腳本說明）
      - name: npm audit
        run: |
          npm audit --omit=dev --json > audit.json || true
          node .github/scripts/audit.js audit.json
